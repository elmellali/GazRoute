databases:
  - name: gazroute-db
    databaseName: gazroute
    user: gazuser
    plan: free
    region: frankfurt

services:
  - type: web
    name: gazroute-backend
    env: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: "pip install -e . && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gazroute-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://gaz-route.vercel.app,http://localhost:3000"
      - key: ENV
        value: "prod"
      - key: PYTHON_VERSION
        value: "3.12.0"
