name: gaz_field_agent
description: Gas Cylinder Distribution - Android-first field agent application
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  geolocator: ^12.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  signature: ^5.5.0
  image_picker: ^1.1.0
  intl: ^0.20.2
  uuid: ^4.4.0
  crypto: ^3.0.3
  connectivity_plus: ^6.0.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/translations/
